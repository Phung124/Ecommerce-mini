<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Overlay Background -->
    <div class="blob blob-1"></div>

    <!-- Header -->
    <header class="glass-header">
        <div class="container header-container">
            <h1 class="logo" onclick="window.location.href='index.html'">E-<span>Store</span> <span style="font-size: 1rem; color: var(--danger);">ADMIN</span></h1>
            <div class="header-actions">
                <div class="user-menu" id="userMenu">
                    <!-- User info injected by app.js -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar glass-card">
            <nav class="admin-nav">
                <div class="admin-nav-item active" onclick="switchTab('products')" id="tabProducts">
                    <i class="fas fa-box"></i> Products
                </div>
                <div class="admin-nav-item" onclick="switchTab('orders')" id="tabOrders">
                    <i class="fas fa-shopping-bag"></i> Orders
                </div>
                <div class="admin-nav-item" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i> Back to Store
                </div>
            </nav>
        </aside>

        <!-- Main Panel -->
        <section class="admin-content glass-card">
            
            <!-- Products Panel -->
            <div id="panelProducts">
                <div class="admin-header">
                    <h3>Manage Products</h3>
                    <button class="primary-btn" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
                </div>
                <div class="table-wrapper">
                    <table class="premium-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTableBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Panel -->
            <div id="panelOrders" style="display: none;">
                <div class="admin-header">
                    <h3>Manage Orders</h3>
                </div>
                <div class="table-wrapper">
                    <table class="premium-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Date</th>
                                <th>Total Amount</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminOrderTableBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content glass-card">
            <button class="close-btn" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
            <div class="modal-header">
                <h3>Product Details</h3>
            </div>
            <form id="productForm" onsubmit="handleSaveProduct(event)">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label>Product Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-tag"></i>
                        <input type="text" id="prodName" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Price</label>
                        <div class="input-wrapper">
                            <i class="fas fa-dollar-sign"></i>
                            <input type="number" step="0.01" id="prodPrice" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <div class="input-wrapper">
                            <i class="fas fa-boxes"></i>
                            <input type="number" id="prodStock" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <div class="input-wrapper">
                        <i class="fas fa-align-left"></i>
                        <input type="text" id="prodDesc">
                    </div>
                </div>
                <button type="submit" class="primary-btn full-width">Save Product</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
