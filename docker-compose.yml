version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: phung
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Redis Cache (Sắp tới sẽ dùng cho Phase 3)
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"



volumes:
  mysql_data:
